services:
  - type: web
    name: posturefit
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm --prefix client install --include=dev && npm --prefix server install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: http://localhost:5173
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        value: posturefit_super_secret_admin_token_2026
